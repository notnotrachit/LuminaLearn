# Continuous Integration Workflow
# Issue #29: Add CI/CD pipeline with GitHub Actions
#
# Triggers on: Pull requests and pushes to main branch
# Runs: Python tests, linting, security scans, Soroban contract tests

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_DB: luminallearn_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password

jobs:
  # ========================================
  # Code Quality Checks
  # ========================================
  lint:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 attendance/ LuminaLearn/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 attendance/ LuminaLearn/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run black (check only)
        run: black --check attendance/ LuminaLearn/

      - name: Run isort (check only)
        run: isort --check-only attendance/ LuminaLearn/

  # ========================================
  # Security Scanning
  # ========================================
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit security scanner
        run: bandit -r attendance/ LuminaLearn/ -f json -o bandit-report.json || true

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ========================================
  # Django Tests
  # ========================================
  django-tests:
    name: Django Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          STELLAR_TESTNET: 'True'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run migrations
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          STELLAR_TESTNET: 'True'
        run: python manage.py migrate --noinput

      - name: Run Django tests with coverage
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          STELLAR_TESTNET: 'True'
        run: |
          pytest --cov=attendance --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: django
          name: django-coverage

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-coverage-report
          path: htmlcov/

  # ========================================
  # Soroban Contract Tests
  # ========================================
  soroban-tests:
    name: Soroban Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install Soroban CLI
        run: |
          cargo install --locked soroban-cli --features opt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: soroban/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Run attendance contract tests
        working-directory: ./soroban/attendance
        run: cargo test

      - name: Run course factory contract tests
        working-directory: ./soroban/course_factory
        run: cargo test

      - name: Build contracts (optimize)
        run: |
          cd soroban/attendance && soroban contract build
          cd ../course_factory && soroban contract build

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts
          path: |
            soroban/attendance/target/wasm32-unknown-unknown/release/*.wasm
            soroban/course_factory/target/wasm32-unknown-unknown/release/*.wasm

  # ========================================
  # Database Migration Validation
  # ========================================
  migrations:
    name: Database Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          STELLAR_TESTNET: 'True'
        run: |
          python manage.py makemigrations --check --dry-run --noinput

      - name: Run migrations forward
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          STELLAR_TESTNET: 'True'
        run: python manage.py migrate --noinput

      - name: Test migration reversibility
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345678901234567890'
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          STELLAR_TESTNET: 'True'
        run: |
          python manage.py migrate attendance zero --noinput
          python manage.py migrate --noinput

  # ========================================
  # Summary
  # ========================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, security, django-tests, soroban-tests, migrations]
    if: success()
    steps:
      - name: CI Success
        run: echo "All CI checks passed successfully!"
